name: Publish release binaries

# Releases here are immutable (org setting): assets can only be attached
# *before* a release is published. So release-please creates the release as
# a **draft** (release-please-config.json: "draft" + "force-tag-creation",
# the latter so the tag exists immediately and the next release PR still
# finds this release), this workflow builds and uploads the binaries to the
# draft, and only then publishes it. A failed build leaves an unpublished
# draft -- never a published release without binaries.
#
# Chained from release-please.yml via workflow_call (a release created with
# the workflow's own GITHUB_TOKEN doesn't fire release events). Can also be
# run by hand for a draft release that's still waiting for its binaries.
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag of the draft release to build, upload to, and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # x86_64-linux only for now -- the natural next step is adding
    # aarch64-unknown-linux-gnu (Raspberry Pi et al., fitting this
    # project's own edge-hardware ethos) via `cross`, and macOS targets on
    # `macos-latest` runners, once this baseline is proven out.
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cd target/release
          tar czf microtak-admin-cli-x86_64-unknown-linux-gnu.tar.gz microtak-admin-cli

      # `gh` finds draft releases by tag (the REST "get release by tag"
      # endpoint, which some upload actions rely on, doesn't return drafts).
      - name: Upload to the draft release
        run: gh release upload "$TAG" target/release/microtak-admin-cli-x86_64-unknown-linux-gnu.tar.gz --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
