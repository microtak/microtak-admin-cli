name: Publish release binaries

# See release-please.yml: chained via workflow_call rather than relying on
# `release: published`, which doesn't fire for a release release-please's
# own GITHUB_TOKEN created. Kept as a fallback for a manually-created
# release too.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # x86_64-linux only for now -- the natural next step is adding
    # aarch64-unknown-linux-gnu (Raspberry Pi et al., fitting this
    # project's own edge-hardware ethos) via `cross`, and macOS targets on
    # `macos-latest` runners, once this baseline is proven out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cd target/release
          tar czf microtak-admin-cli-x86_64-unknown-linux-gnu.tar.gz microtak-admin-cli

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          files: target/release/microtak-admin-cli-x86_64-unknown-linux-gnu.tar.gz
